name: Android debug APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test policy
        run: |
          mkdir -p build/policy-tests
          javac -d build/policy-tests app/src/main/java/dev/quietflow/core/*.java tests/PolicyEngineTest.java
          java -cp build/policy-tests PolicyEngineTest
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: QuietFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
